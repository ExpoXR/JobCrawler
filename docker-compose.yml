# ExpoJobCrawler — self-hosted stack.
#
#   docker compose up -d          start everything
#   docker compose run --rm migrate   apply database migrations
#
# Postgres and Redis are not published to the host by default: only the web
# service is reachable from outside the compose network.

name: expojobcrawler

services:
  postgres:
    # PostGIS + pgvector: see docker/postgres/Dockerfile for why this is built
    # rather than pulled.
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    user: postgres
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 512mb
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=80
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expojobcrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-expojobcrawler}
      # Postgres refuses to start an initdb without this when trust is disabled.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-expojobcrawler} -d ${POSTGRES_DB:-expojobcrawler}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    user: redis
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      # Redis is not published to the host and lives on an internal network, so
      # this is defence in depth: it turns a container escape or a stray
      # container on the same network from full queue access into nothing.
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  # One-shot migration runner. Not started by `up`; invoke it explicitly.
  migrate:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-expojobcrawler}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expojobcrawler}
      MIGRATIONS_DIR: /app/migrations
    command: ['node_modules/.bin/tsx', 'packages/database/src/cli/migrate.ts']
    mem_limit: 512m
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        PUBLIC_ROBOTS_NOINDEX: ${PUBLIC_ROBOTS_NOINDEX:-true}
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-expojobcrawler}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expojobcrawler}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NOMINATIM_BASE_URL: http://nominatim:8080
      NODE_OPTIONS: --max-old-space-size=320
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # One hop: the reverse proxy in front of this stack. Set to 0 when the
      # container is reached directly, or higher behind a CDN.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      CSP_MODE: ${CSP_MODE:-report-only}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 2
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-expojobcrawler}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expojobcrawler}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NOMINATIM_BASE_URL: http://nominatim:8080
      NODE_OPTIONS: --max-old-space-size=512
      MIGRATIONS_DIR: /app/migrations
      # The worker resolves provider settings too, so it needs the same key.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Crawling is I/O bound; a couple of replicas saturate a small host well.
    deploy:
      replicas: 1
    networks: [internal]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
    name: expojobcrawler-internal
